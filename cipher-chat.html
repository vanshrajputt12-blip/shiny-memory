<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cipher — Encrypted Chat</title>
<style>
  :root{
    --ink:#12141c; --panel:#1b1e29; --line:#333850;
    --text:#eceaf5; --sub:#9a9db3; --accent:#c17ae8; --accent2:#4c8fe8;
    --good:#6fcf97; --danger:#e06868;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--text); font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    background:
      radial-gradient(circle at 10% 10%, rgba(140,90,230,.28), transparent 42%),
      radial-gradient(circle at 90% 20%, rgba(60,130,220,.22), transparent 45%),
      radial-gradient(circle at 30% 95%, rgba(60,200,150,.18), transparent 48%),
      var(--ink);
    background-attachment:fixed;
    display:flex; flex-direction:column; height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; width:100%; display:flex; flex-direction:column; flex:1; min-height:0; padding:0 16px;}
  header{padding:18px 4px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .brand{font-size:20px;}
  .brand .lock{color:var(--accent);}
  .status{font-family:'SF Mono',ui-monospace,monospace; font-size:11px; color:var(--sub);}
  .status.on{color:var(--good);}

  /* Gate screen */
  .gate{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:20px;}
  .gate p{color:var(--sub); font-size:14px; max-width:380px; line-height:1.5;}
  .gate input{width:260px; text-align:center;}

  input,select{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:10px 12px; font-family:inherit; font-size:14px;
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 14px 1px rgba(140,90,230,.3);}

  button{
    background:var(--accent); color:#1b0f24; border:none; border-radius:8px;
    padding:10px 18px; font-family:'SF Mono',ui-monospace,monospace; font-size:12px;
    font-weight:600; cursor:pointer; letter-spacing:.02em;
    transition:box-shadow .25s ease, transform .15s ease;
  }
  button:hover{box-shadow:0 0 0 1px var(--accent), 0 0 18px 2px var(--accent), 0 0 30px 6px rgba(76,143,232,.3); transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--sub); padding:6px 10px; font-size:11px;}
  button.ghost:hover{border-color:var(--accent); color:var(--accent); box-shadow:0 0 10px 1px rgba(140,90,230,.35);}

  /* Chat */
  .chat{display:none; flex:1; flex-direction:column; min-height:0;}
  .thread{flex:1; overflow-y:auto; padding:16px 4px; display:flex; flex-direction:column; gap:10px;}
  .msg{max-width:78%; padding:9px 13px; border-radius:12px; background:var(--panel); border:1px solid var(--line); align-self:flex-start;}
  .msg.mine{align-self:flex-end; background:rgba(140,90,230,.16); border-color:rgba(140,90,230,.4);}
  .msg .who{font-family:'SF Mono',ui-monospace,monospace; font-size:10px; color:var(--sub); margin-bottom:3px;}
  .msg .body{font-size:15px; line-height:1.4; word-wrap:break-word;}
  .msg .body.bad{color:var(--danger); font-style:italic; font-size:13px;}
  .msg .meta{font-family:'SF Mono',ui-monospace,monospace; font-size:9px; color:var(--sub); margin-top:4px; display:flex; gap:6px; align-items:center;}
  .cipherpeek{opacity:.5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px;}

  .composer{display:flex; gap:8px; padding:14px 4px; border-top:1px solid var(--line);}
  .composer input{flex:1;}
  .empty{color:var(--sub); font-size:13px; text-align:center; margin-top:40px; font-style:italic;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="lock">🔒</span> Cipher</div>
    <div class="status" id="status">connecting…</div>
  </header>

  <div class="gate" id="gate">
    <p>Enter a room key. Anyone with the same key can read this room's messages — everyone else only ever sees ciphertext, including the server storing them.</p>
    <input type="password" id="passInput" placeholder="Room key">
    <input type="text" id="roomInput" placeholder="Room name (e.g. team-standup)" value="general">
    <button onclick="enterRoom()">UNLOCK CHAT</button>
    <div id="gateMsg" style="font-family:'SF Mono',ui-monospace,monospace;font-size:11px;color:var(--danger);"></div>
  </div>

  <div class="chat" id="chat">
    <div class="thread" id="thread"><div class="empty">No messages yet — say hello.</div></div>
    <div class="composer">
      <input type="text" id="msgInput" placeholder="Type an encrypted message…">
      <button onclick="sendMessage()">SEND</button>
      <button class="ghost" onclick="leaveRoom()">LEAVE</button>
    </div>
  </div>
</div>

<script>
let db, user, myId, key, roomName, unsub;
const profileCache = {};

async function init(){
  db = await claude.use("db");
  user = await claude.use("user");
  document.getElementById('status').textContent = db ? 'ready' : 'unavailable';
  if(!db){ document.getElementById('gateMsg').textContent = 'Shared storage isn\'t available in this view.'; return; }
  myId = await user.id();
}
init();

// --- crypto: AES-GCM key derived from the room key via PBKDF2 ---
async function deriveKey(passphrase, room){
  const enc = new TextEncoder();
  const salt = enc.encode('cipher-chat:' + room); // room name salts the key
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
    baseKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
function buf2b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b642buf(b64){ return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }

async function encrypt(text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder().encode(text);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc);
  return { ciphertext: buf2b64(ct), iv: buf2b64(iv) };
}
async function decrypt(ciphertext, iv){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b642buf(iv)}, key, b642buf(ciphertext));
  return new TextDecoder().decode(pt);
}

async function enterRoom(){
  const pass = document.getElementById('passInput').value;
  const room = document.getElementById('roomInput').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-') || 'general';
  if(!pass){ document.getElementById('gateMsg').textContent = 'Enter a room key first.'; return; }
  if(!db){ return; }
  key = await deriveKey(pass, room);
  roomName = room;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
  document.getElementById('status').textContent = 'room: ' + room;
  document.getElementById('status').classList.add('on');
  subscribeToRoom();
}
function leaveRoom(){
  if(unsub) unsub();
  key = null; roomName = null;
  document.getElementById('thread').innerHTML = '<div class="empty">No messages yet — say hello.</div>';
  document.getElementById('chat').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('status').textContent = 'disconnected';
  document.getElementById('status').classList.remove('on');
}

function subscribeToRoom(){
  const q = db.collection('rooms/' + roomName + '/messages').orderBy('ts','asc').limit(200);
  unsub = q.onSnapshot(async snap => {
    const docs = snap.docs;
    if(!docs.length){ document.getElementById('thread').innerHTML = '<div class="empty">No messages yet — say hello.</div>'; return; }
    const ids = [...new Set(docs.map(d => d.data().senderId).filter(Boolean))];
    const profiles = await user.profiles(ids);
    const rows = await Promise.all(docs.map(d => renderMsg(d.data(), profiles)));
    const thread = document.getElementById('thread');
    thread.innerHTML = rows.join('');
    thread.scrollTop = thread.scrollHeight;
  }, err => {
    document.getElementById('status').textContent = 'error: ' + err.code;
  });
}

async function renderMsg(m, profiles){
  const mine = m.senderId === myId;
  const name = mine ? 'You' : ((profiles[m.senderId] && profiles[m.senderId].name) || 'Someone');
  let body, bad = false;
  try{ body = escapeHtml(await decrypt(m.ciphertext, m.iv)); }
  catch(e){ body = 'unable to decrypt — wrong room key'; bad = true; }
  const time = new Date(m.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const peek = escapeHtml(m.ciphertext.slice(0,22)) + '…';
  return `<div class="msg ${mine?'mine':''}">
    <div class="who">${escapeHtml(name)}</div>
    <div class="body ${bad?'bad':''}">${body}</div>
    <div class="meta"><span>${time}</span><span class="cipherpeek" title="${escapeHtml(m.ciphertext)}">${peek}</span></div>
  </div>`;
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !key) return;
  const {ciphertext, iv} = await encrypt(text);
  input.value = '';
  try{
    await db.collection('rooms/' + roomName + '/messages').add({
      senderId: myId, ciphertext, iv, ts: Date.now()
    });
  }catch(e){
    document.getElementById('status').textContent = 'send failed: ' + (e.code||'error');
  }
}
document.getElementById('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });
document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') enterRoom(); });

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
